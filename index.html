<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<meta name="theme-color" content="#0f0f13"/>
<title>Finance Tracker</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#0d0d14;--bg2:#13131e;--bg3:#1c1c2a;--card:#191926;
  --border:rgba(255,255,255,.08);--text:#f0f0f8;--muted:#7878a0;
  --accent:#7c6fff;--accent2:#a89fff;
  --c-food:#00c896;--c-trans:#3d9cff;--c-coffee:#ff9a3c;--c-self:#df6fff;
  --c-social:#ff5c8a;--c-gym:#ffc62d;--c-entert:#ff6b35;--c-work:#39c8e8;
  --r:16px;--rs:10px;
  --sab:env(safe-area-inset-bottom,0px);
  --sat:env(safe-area-inset-top,0px);
  --grad1:linear-gradient(135deg,#7c6fff22,#ff5c8a11);
  --grad2:linear-gradient(135deg,#00c89622,#3d9cff11);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,'SF Pro Display','Segoe UI',sans-serif;height:100%;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;background:var(--bg)}

/* screens */
.scr{display:none;flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(72px + var(--sab))}
.scr.on{display:block}

/* header */
.hdr{padding:calc(16px + var(--sat)) 16px 14px;position:sticky;top:0;background:var(--bg);z-index:10;border-bottom:1px solid var(--border)}
.hdr h1{font-size:22px;font-weight:800;letter-spacing:-.5px;background:linear-gradient(90deg,var(--text),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hdr p{font-size:12px;color:var(--muted);margin-top:3px}

/* bottom nav */
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(13,13,20,.92);border-top:1px solid var(--border);display:flex;padding-bottom:var(--sab);z-index:100;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.nb{flex:1;background:none;border:none;color:var(--muted);padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600;cursor:pointer;transition:all .2s;-webkit-appearance:none}
.nb svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.nb.on{color:var(--accent2)}
.nb.on svg{stroke:var(--accent2);transform:scale(1.15)}

/* metrics */
.mg{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 16px}
.mc{background:var(--card);border-radius:var(--r);padding:14px;border:1px solid var(--border);position:relative;overflow:hidden}
.mc::before{content:'';position:absolute;inset:0;background:var(--grad1);opacity:.5;pointer-events:none}
.ml{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px;position:relative}
.mv{font-size:20px;font-weight:800;position:relative;letter-spacing:-.3px}
.ms{font-size:11px;color:var(--muted);margin-top:3px;position:relative}

/* add form */
.aw{padding:12px 16px 0}
.abox{background:linear-gradient(135deg,#1e1a3a,#1a1a2e);border-radius:var(--r);padding:12px 16px 10px;margin-bottom:12px;border:1px solid rgba(124,111,255,.25);text-align:center;position:relative;overflow:hidden}
.abox::before{content:'';position:absolute;top:-30px;right:-30px;width:100px;height:100px;background:radial-gradient(circle,rgba(124,111,255,.2),transparent 70%);pointer-events:none}
.albl{font-size:10px;color:var(--accent2);text-transform:uppercase;letter-spacing:.7px;margin-bottom:4px;font-weight:600}
.afld{font-size:34px;font-weight:800;color:var(--text);background:none;border:none;width:100%;text-align:center;outline:none;caret-color:var(--accent2);font-family:inherit;letter-spacing:-.5px}
.afld::placeholder{color:rgba(255,255,255,.15)}
.ahint{font-size:10px;color:rgba(168,159,255,.6);margin-top:4px}

/* two-col cats */
.cc{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.cch{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin-bottom:6px;padding:0 2px}
.col{display:flex;flex-direction:column;gap:6px}
.cb{background:var(--card);border:1.5px solid var(--border);border-radius:var(--rs);padding:9px 10px;display:flex;align-items:center;gap:7px;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;transition:all .18s;text-align:left;width:100%;-webkit-appearance:none}
.cb:active{transform:scale(.96)}
.cb .d{width:8px;height:8px;border-radius:50%;flex-shrink:0;box-shadow:0 0 6px currentColor}
.cb.on{color:var(--text);border-width:2px;transform:scale(1.01)}
.cb[data-c="Food & Water"].on   {border-color:var(--c-food);  background:rgba(0,200,150,.13);box-shadow:0 0 12px rgba(0,200,150,.1)}
.cb[data-c="Transportation"].on {border-color:var(--c-trans); background:rgba(61,156,255,.13);box-shadow:0 0 12px rgba(61,156,255,.1)}
.cb[data-c="Coffee & Sweets"].on{border-color:var(--c-coffee);background:rgba(255,154,60,.13); box-shadow:0 0 12px rgba(255,154,60,.1)}
.cb[data-c="Self Care"].on      {border-color:var(--c-self);  background:rgba(223,111,255,.13);box-shadow:0 0 12px rgba(223,111,255,.1)}
.cb[data-c="Social & Family"].on{border-color:var(--c-social);background:rgba(255,92,138,.13); box-shadow:0 0 12px rgba(255,92,138,.1)}
.cb[data-c="Gym & Health"].on   {border-color:var(--c-gym);   background:rgba(255,198,45,.13); box-shadow:0 0 12px rgba(255,198,45,.1)}
.cb[data-c="Entertainment"].on  {border-color:var(--c-entert);background:rgba(255,107,53,.13); box-shadow:0 0 12px rgba(255,107,53,.1)}
.cb[data-c="Work & Future Cash"].on{border-color:var(--c-work);background:rgba(57,200,232,.13);box-shadow:0 0 12px rgba(57,200,232,.1)}

/* form card */
.fc{background:var(--card);border-radius:var(--r);border:1px solid var(--border);overflow:hidden;margin-bottom:12px}
.fr{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border)}
.fr:last-child{border-bottom:none}
.frl{font-size:12px;color:var(--muted);width:64px;flex-shrink:0;font-weight:500}
.fr input,.fr select{flex:1;background:none;border:none;color:var(--text);font-size:14px;outline:none;text-align:right;font-family:inherit;-webkit-appearance:none}
.fr select option{background:var(--bg2)}

/* today-logged banner */
.tbanner{background:linear-gradient(135deg,rgba(0,200,150,.1),rgba(61,156,255,.07));border:1px solid rgba(0,200,150,.25);border-radius:var(--r);padding:12px 14px;margin-bottom:12px;display:none}
.tbanner.on{display:block}
.tban-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.tban-lbl{font-size:11px;font-weight:700;color:#00c896;text-transform:uppercase;letter-spacing:.4px}
.tban-amt{font-size:15px;font-weight:700;color:var(--text)}
.tban-row{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.tban-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.tban-cat{font-size:11px;color:var(--muted);flex:1}
.tban-val{font-size:11px;font-weight:600;color:var(--text)}
.cb .ck{margin-left:auto;font-size:11px;color:#1D9E75;display:none}
.cb.done .ck{display:inline}
.cb.done{border-color:rgba(29,158,117,.4)!important;background:rgba(29,158,117,.07)!important;color:var(--text)!important}
/* save btn */
.sbtn{width:100%;background:linear-gradient(135deg,#7c6fff,#a855f7);color:#fff;border:none;border-radius:var(--r);padding:14px;font-size:15px;font-weight:700;cursor:pointer;transition:all .18s;font-family:inherit;-webkit-appearance:none;box-shadow:0 4px 20px rgba(124,111,255,.35);letter-spacing:.2px}
.sbtn:active{opacity:.85;transform:scale(.98);box-shadow:0 2px 10px rgba(124,111,255,.25)}

/* toast */
.toast{position:fixed;bottom:calc(80px + var(--sab));left:50%;transform:translateX(-50%);background:#1D9E75;color:#fff;padding:10px 22px;border-radius:30px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s;z-index:999;white-space:nowrap}
.toast.on{opacity:1}

/* filter bar */
.fb{display:flex;gap:8px;padding:10px 16px;overflow-x:auto;scrollbar-width:none}
.fb::-webkit-scrollbar{display:none}
.fp{flex-shrink:0;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:6px 13px;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;transition:all .15s;white-space:nowrap}
.fp.on{background:linear-gradient(135deg,var(--accent),#a855f7);color:#fff;border-color:var(--accent);box-shadow:0 2px 10px rgba(124,111,255,.3)}

/* history */
.dg{padding:0 16px;margin-bottom:4px}
.dh{display:flex;justify-content:space-between;align-items:center;padding:10px 0 5px;font-size:11px;font-weight:700;color:var(--accent2);text-transform:uppercase;letter-spacing:.4px}
.ei{background:var(--card);border-radius:var(--rs);border:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:11px 12px;margin-bottom:5px;transition:border-color .15s}
.eico{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.ebody{flex:1;min-width:0}
.ecat{font-size:13px;font-weight:700}
.enote{font-size:11px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eright{text-align:right;flex-shrink:0}
.eamt{font-size:13px;font-weight:800}
.edate{font-size:11px;color:var(--muted);margin-top:1px}
.dbtn{background:rgba(220,50,50,.15);border:1px solid rgba(220,50,50,.2);color:#ff6b6b;border-radius:var(--rs);padding:0 12px;cursor:pointer;font-size:16px;flex-shrink:0;height:56px;-webkit-appearance:none;transition:all .15s}
.dbtn:active{background:rgba(220,50,50,.35)}

/* empty */
.empty{text-align:center;padding:48px 16px;color:var(--muted);font-size:14px}
.eico2{font-size:36px;margin-bottom:10px}

/* analysis */
.sec{padding:0 16px;margin-bottom:16px}
.stitle{font-size:11px;font-weight:700;color:var(--accent2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px}
.ccard{background:var(--card);border-radius:var(--r);border:1px solid var(--border);padding:12px;position:relative;overflow:hidden}
.ccard::after{content:'';position:absolute;bottom:-20px;right:-20px;width:80px;height:80px;background:radial-gradient(circle,rgba(124,111,255,.07),transparent 70%);pointer-events:none}
.cw{position:relative}
.leg{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px}
.li{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--muted)}
.ld{width:7px;height:7px;border-radius:2px;flex-shrink:0}
.msel{margin-bottom:12px}
.msel select{width:100%;background:var(--card);border:1px solid var(--border);border-radius:var(--rs);color:var(--text);padding:10px 14px;font-size:14px;outline:none;font-family:inherit;-webkit-appearance:none}
.br{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.brl{font-size:11px;color:var(--muted);width:100px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btrack{flex:1;background:var(--bg3);border-radius:4px;height:7px;overflow:hidden}
.bfill{height:100%;border-radius:4px;transition:width .4s}
.bval{font-size:11px;color:var(--muted);width:68px;text-align:right;flex-shrink:0}

::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:3px}
/* analysis daily list */
.adrow{display:flex;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.adrow:last-child{border-bottom:none}
.adrow-date{font-size:12px;font-weight:600;color:var(--text);width:72px;flex-shrink:0}
.adrow-bars{flex:1;display:flex;flex-direction:column;gap:3px}
.adrow-seg{height:5px;border-radius:3px;min-width:3px}
.adrow-bar{display:flex;gap:2px;align-items:center}
.adrow-amt{font-size:13px;font-weight:700;color:var(--text);text-align:right;width:80px;flex-shrink:0}
/* monthly summary table */
.mtrow{display:flex;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.mtrow:last-child{border-bottom:none}
.mtrow.header{padding-bottom:6px}
.mtrow-mo{font-size:12px;font-weight:700;color:var(--text);flex:1}
.mtrow-amt{font-size:13px;font-weight:700;color:var(--text);width:90px;text-align:right;flex-shrink:0}
.mtrow-bar{flex:2;margin:0 10px}
.mtrow-fill{height:6px;border-radius:3px;background:var(--accent);transition:width .4s}
.mtrow.cur .mtrow-mo{color:var(--accent2)}
.mtrow.cur .mtrow-fill{background:var(--accent2)}
</style>
</head>
<body>
<div class="app">

<!-- ADD -->
<div class="scr on" id="s-add">
  <div class="hdr"><h1>Add Expense</h1><p id="ddisp"></p></div>
  <div class="aw">
    <!-- today logged banner -->
    <div class="tbanner" id="tbanner">
      <div class="tban-top">
        <span class="tban-lbl">✅ Today logged</span>
        <span class="tban-amt" id="tban-amt"></span>
      </div>
      <div id="tban-cats"></div>
    </div>
    <div class="abox">
      <div class="albl">Amount (ETB)</div>
      <input class="afld" id="amt" type="text" inputmode="decimal" placeholder="0" autocomplete="off"/>
      <div class="ahint">supports + − × ÷</div>
    </div>

    <div class="cc">
      <div>
        <div class="cch">Essentials</div>
        <div class="col">
          <button class="cb" data-c="Food & Water"><span class="d" style="background:var(--c-food)"></span>🥗 Food & Water<span class="ck">✓</span></button>
          <button class="cb" data-c="Transportation"><span class="d" style="background:var(--c-trans)"></span>🚌 Transport<span class="ck">✓</span></button>
          <button class="cb" data-c="Coffee & Sweets"><span class="d" style="background:var(--c-coffee)"></span>☕ Coffee & Sweets<span class="ck">✓</span></button>
          <button class="cb" data-c="Self Care"><span class="d" style="background:var(--c-self)"></span>🪥 Self Care<span class="ck">✓</span></button>
        </div>
      </div>
      <div>
        <div class="cch">Lifestyle</div>
        <div class="col">
          <button class="cb" data-c="Social & Family"><span class="d" style="background:var(--c-social)"></span>👥 Social & Family<span class="ck">✓</span></button>
          <button class="cb" data-c="Gym & Health"><span class="d" style="background:var(--c-gym)"></span>🏋️ Gym & Health<span class="ck">✓</span></button>
          <button class="cb" data-c="Entertainment"><span class="d" style="background:var(--c-entert)"></span>🍺 Entertainment<span class="ck">✓</span></button>
          <button class="cb" data-c="Work & Future Cash"><span class="d" style="background:var(--c-work)"></span>💼 Work & Future Cash<span class="ck">✓</span></button>
        </div>
      </div>
    </div>

    <div class="fc">
      <div class="fr"><span class="frl">Note</span><input type="text" id="note" placeholder="optional…"/></div>
      <div class="fr"><span class="frl">Date</span><input type="date" id="dt"/></div>
    </div>
    <button class="sbtn" onclick="addExp()">Save Expense</button>
  </div>
</div>

<!-- TODAY -->
<div class="scr" id="s-today">
  <div class="hdr"><h1>Today</h1><p id="tdlbl"></p></div>
  <div class="mg" id="tm"></div>
  <div class="sec"><div class="stitle">Breakdown</div><div class="ccard"><div id="tbars"></div></div></div>
  <div class="sec"><div class="stitle">Transactions</div><div id="tlist"></div></div>
</div>

<!-- HISTORY -->
<div class="scr" id="s-hist">
  <div class="hdr"><h1>History</h1></div>
  <div class="fb" id="fb">
    <div class="fp on" onclick="setF(this,'')">All</div>
    <div class="fp" onclick="setF(this,'Food & Water')">🥗 Food</div>
    <div class="fp" onclick="setF(this,'Transportation')">🚌 Transport</div>
    <div class="fp" onclick="setF(this,'Coffee & Sweets')">☕ Coffee</div>
    <div class="fp" onclick="setF(this,'Self Care')">🪥 Self Care</div>
    <div class="fp" onclick="setF(this,'Social & Family')">👥 Social</div>
    <div class="fp" onclick="setF(this,'Gym & Health')">🏋️ Gym</div>
    <div class="fp" onclick="setF(this,'Entertainment')">🍺 Fun</div>
    <div class="fp" onclick="setF(this,'Work & Future Cash')">💼 Work</div>
  </div>
  <div id="hlist"></div>
</div>

<!-- ANALYSIS -->
<div class="scr" id="s-anal">
  <div class="hdr"><h1>Analysis</h1></div>
  <div style="padding:12px 16px 0">
    <div class="msel"><select id="msel" onchange="renderAnal()"></select></div>
  </div>
  <div class="mg" id="am"></div>
  <div class="sec">
    <div class="stitle">Daily spending</div>
    <div class="ccard">
      <div class="leg" id="dleg"></div>
      <div class="cw" style="height:190px"><canvas id="dc" role="img" aria-label="Daily spending chart"></canvas></div>
    </div>
  </div>
  <div class="sec">
    <div class="stitle">Category share</div>
    <div class="ccard">
      <div class="leg" id="doleg"></div>
      <div class="cw" style="height:180px"><canvas id="doc" role="img" aria-label="Category donut chart"></canvas></div>
    </div>
  </div>
  <div class="sec">
    <div class="stitle">Monthly trend</div>
    <div class="ccard">
      <div class="cw" style="height:170px"><canvas id="tc" role="img" aria-label="Monthly trend chart"></canvas></div>
    </div>
  </div>
  <div class="sec">
    <div class="stitle">Daily totals — <span id="admonth-lbl"></span></div>
    <div class="ccard"><div id="adlist"></div></div>
  </div>
  <div class="sec">
    <div class="stitle">All months summary</div>
    <div class="ccard"><div id="mtlist"></div></div>
  </div>
</div>

<!-- NAV -->
<nav class="nav">
  <button class="nb on" id="n-add" onclick="go('add')">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>Add
  </button>
  <button class="nb" id="n-today" onclick="go('today')">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Today
  </button>
  <button class="nb" id="n-hist" onclick="go('hist')">
    <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3" cy="6" r="1" fill="currentColor" stroke="none"/><circle cx="3" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="3" cy="18" r="1" fill="currentColor" stroke="none"/></svg>History
  </button>
  <button class="nb" id="n-anal" onclick="go('anal')">
    <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>Analysis
  </button>
</nav>
</div>

<div class="toast" id="toast"></div>

<script>
/* ── Telegram init ── */
const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();tg.setHeaderColor('#0f0f13');tg.setBackgroundColor('#0f0f13')}

/* ── Constants ── */
const CATS=['Food & Water','Transportation','Coffee & Sweets','Self Care','Social & Family','Gym & Health','Entertainment','Work & Future Cash'];
const CC={'Food & Water':'#00c896','Transportation':'#3d9cff','Coffee & Sweets':'#ff9a3c','Self Care':'#df6fff','Social & Family':'#ff5c8a','Gym & Health':'#ffc62d','Entertainment':'#ff6b35','Work & Future Cash':'#39c8e8'};
const CE={'Food & Water':'🥗','Transportation':'🚌','Coffee & Sweets':'☕','Self Care':'🪥','Social & Family':'👥','Gym & Health':'🏋️','Entertainment':'🍺','Work & Future Cash':'💼'};

/* ── State ── */
let EXP=[],SEL='',HFILT='';
let DC=null,DOC=null,TC=null;

/* ── Storage ── */
const SKEY='fin_'+(tg?.initDataUnsafe?.user?.id||'x');
function load(){try{EXP=JSON.parse(localStorage.getItem(SKEY)||'[]')}catch{EXP=[]}}
function save(){localStorage.setItem(SKEY,JSON.stringify(EXP))}

/* ── Utils ── */
function today(){return new Date().toISOString().slice(0,10)}
function fmt(n){return 'ETB '+Math.round(n).toLocaleString()}
function fdate(d){return new Date(d+'T00:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}

/* ── Nav ── */
function go(s){
  document.querySelectorAll('.scr').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.nb').forEach(x=>x.classList.remove('on'));
  document.getElementById('s-'+s).classList.add('on');
  document.getElementById('n-'+s).classList.add('on');
  if(s==='add')updateAddBanner();
  if(s==='today')rToday();
  if(s==='hist')rHist();
  if(s==='anal'){popMsel();renderAnal()}
}

/* ── Add ── */
document.getElementById('dt').value=today();
document.getElementById('ddisp').textContent=fdate(today());

document.querySelectorAll('.cb').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.cb').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');SEL=b.dataset.c;
    tg?.HapticFeedback?.selectionChanged();
  });
});

function updateAddBanner(){
  const t=today();
  const td=EXP.filter(e=>e.date===t);
  const banner=document.getElementById('tbanner');
  // mark category buttons that have entries today
  document.querySelectorAll('.cb').forEach(b=>{
    const has=td.some(e=>e.cat===b.dataset.c);
    b.classList.toggle('done',has);
  });
  if(!td.length){banner.classList.remove('on');return}
  banner.classList.add('on');
  document.getElementById('tban-amt').textContent=fmt(td.reduce((s,e)=>s+e.amount,0));
  const bycat={};td.forEach(e=>bycat[e.cat]=(bycat[e.cat]||0)+e.amount);
  const sorted=Object.entries(bycat).sort((a,b)=>b[1]-a[1]);
  document.getElementById('tban-cats').innerHTML=sorted.map(([c,a])=>
    `<div class="tban-row"><span class="tban-dot" style="background:${CC[c]}"></span><span class="tban-cat">${CE[c]} ${c}</span><span class="tban-val">${fmt(a)}</span></div>`
  ).join('');
}

function evalAmt(raw){
  if(!raw) return 0;
  // allow + - * / x × ÷
  const safe=raw.replace(/x/gi,'*').replace(/×/g,'*').replace(/÷/g,'/').replace(/[^0-9+\-*/.]/g,'').trim();
  if(!safe) return 0;
  try{
    const res=Function('"use strict";return ('+safe+')')();
    if(isFinite(res)&&res>0) return Math.round(res*100)/100;
  }catch(e){}
  return parseFloat(raw)||0;
}
function addExp(){
  const raw=document.getElementById('amt').value.trim();
  const a=evalAmt(raw);
  const d=document.getElementById('dt').value;
  const n=document.getElementById('note').value.trim();
  if(!a||a<=0){toast('Enter a valid amount',1);return}
  if(!SEL){toast('Pick a category',1);return}
  if(!d){toast('Pick a date',1);return}
  EXP.push({id:Date.now(),amount:a,date:d,note:n,cat:SEL});
  save();
  document.getElementById('amt').value='';
  document.getElementById('note').value='';
  document.getElementById('dt').value=today();
  document.querySelectorAll('.cb').forEach(x=>x.classList.remove('on'));
  SEL='';
  tg?.HapticFeedback?.notificationOccurred('success');
  updateAddBanner();
  toast('✓ Saved');
}

function toast(msg,err=0){
  const t=document.getElementById('toast');
  t.textContent=msg;t.style.background=err?'#c0392b':'#1D9E75';
  t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2000);
}

/* ── Today ── */
function rToday(){
  const t=today();
  document.getElementById('tdlbl').textContent=fdate(t);
  const td=EXP.filter(e=>e.date===t);
  const total=td.reduce((s,e)=>s+e.amount,0);
  const m={};td.forEach(e=>m[e.cat]=(m[e.cat]||0)+e.amount);
  const top=Object.entries(m).sort((a,b)=>b[1]-a[1])[0]?.[0]||'—';
  document.getElementById('tm').innerHTML=`
    <div class="mc"><div class="ml">Total today</div><div class="mv">${fmt(total)}</div><div class="ms">${td.length} transaction${td.length!==1?'s':''}</div></div>
    <div class="mc"><div class="ml">Top category</div><div class="mv" style="font-size:15px">${CE[top]||''} ${top}</div></div>`;
  const srt=Object.entries(m).sort((a,b)=>b[1]-a[1]);
  const mx=srt[0]?.[1]||1;
  document.getElementById('tbars').innerHTML=srt.length
    ?srt.map(([c,a])=>`<div class="br"><div class="brl">${CE[c]} ${c}</div><div class="btrack"><div class="bfill" style="width:${Math.round(a/mx*100)}%;background:${CC[c]}"></div></div><div class="bval">${fmt(a)}</div></div>`).join('')
    :'<div style="color:var(--muted);font-size:13px;padding:4px 0">No expenses yet today.</div>';
  document.getElementById('tlist').innerHTML=td.length
    ?td.slice().reverse().map(ei).join('')
    :'<div class="empty"><div class="eico2">📭</div>No transactions today.</div>';
}

/* ── History ── */
function setF(el,cat){
  document.querySelectorAll('.fp').forEach(p=>p.classList.remove('on'));
  el.classList.add('on');HFILT=cat;rHist();
}
function rHist(){
  let list=[...EXP].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
  if(HFILT)list=list.filter(e=>e.cat===HFILT);
  if(!list.length){document.getElementById('hlist').innerHTML='<div class="empty"><div class="eico2">📭</div>No expenses found.</div>';return}
  const g={};list.forEach(e=>(g[e.date]=g[e.date]||[]).push(e));
  document.getElementById('hlist').innerHTML=Object.entries(g).map(([d,items])=>{
    const tot=items.reduce((s,e)=>s+e.amount,0);
    const lbl=d===today()?'Today':fdate(d);
    return`<div class="dg"><div class="dh"><span>${lbl}</span><span>${fmt(tot)}</span></div>${items.map(ei).join('')}</div>`;
  }).join('');
}

function ei(e){
  return`<div class="ei" id="e${e.id}">
    <div class="eico" style="background:${CC[e.cat]||'#333'}22">${CE[e.cat]||'💸'}</div>
    <div class="ebody"><div class="ecat">${e.cat}</div>${e.note?`<div class="enote">${e.note}</div>`:''}</div>
    <div class="eright"><div class="eamt">${fmt(e.amount)}</div><div class="edate">${e.date}</div></div>
    <button class="dbtn" onclick="del(${e.id})" aria-label="Delete">🗑</button>
  </div>`;
}

function del(id){
  const run=()=>{EXP=EXP.filter(e=>e.id!==id);save();const el=document.getElementById('e'+id);if(el)el.remove();tg?.HapticFeedback?.notificationOccurred('warning')};
  tg?.showConfirm?tg.showConfirm('Delete this expense?',ok=>{if(ok)run()}):confirm('Delete?')&&run();
}

/* ── Analysis ── */
function months(){
  const s=new Set(EXP.map(e=>e.date.slice(0,7)));
  s.add(today().slice(0,7));return[...s].sort().reverse();
}
function popMsel(){
  const sl=document.getElementById('msel');
  const ms=months();const cur=sl.value||ms[0];
  sl.innerHTML=ms.map(m=>`<option value="${m}"${m===cur?' selected':''}>${m}</option>`).join('');
}

const gridColor='rgba(255,255,255,.05)';
const tickColor='#8888a0';
const baseScale={ticks:{font:{size:10},color:tickColor},grid:{color:gridColor}};

function renderAnal(){
  const mo=document.getElementById('msel').value||today().slice(0,7);
  const me=EXP.filter(e=>e.date.startsWith(mo));
  const total=me.reduce((s,e)=>s+e.amount,0);
  const days=[...new Set(me.map(e=>e.date))].sort();
  const avg=days.length?total/days.length:0;

  document.getElementById('am').innerHTML=`
    <div class="mc"><div class="ml">Month total</div><div class="mv">${fmt(total)}</div><div class="ms">${days.length} active days</div></div>
    <div class="mc"><div class="ml">Daily average</div><div class="mv">${fmt(avg)}</div><div class="ms">${me.length} transactions</div></div>`;

  document.getElementById('dleg').innerHTML=CATS.map(c=>`<span class="li"><span class="ld" style="background:${CC[c]}"></span>${c}</span>`).join('');

  const ds=CATS.map(cat=>({label:cat,data:days.map(d=>me.filter(e=>e.date===d&&e.cat===cat).reduce((s,e)=>s+e.amount,0)),backgroundColor:CC[cat],borderRadius:3,borderSkipped:false}));
  if(DC)DC.destroy();
  DC=new Chart(document.getElementById('dc'),{type:'bar',data:{labels:days.map(d=>d.slice(5)),datasets:ds},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${c.dataset.label}: ETB ${Math.round(c.raw).toLocaleString()}`}}},scales:{x:{...baseScale,stacked:true},y:{...baseScale,stacked:true,ticks:{callback:v=>'ETB '+Math.round(v/1000)+'k',font:{size:10},color:tickColor}}}}});

  const ct=CATS.map(c=>me.filter(e=>e.cat===c).reduce((s,e)=>s+e.amount,0));
  const nz=CATS.filter((_,i)=>ct[i]>0);
  document.getElementById('doleg').innerHTML=nz.map(c=>`<span class="li"><span class="ld" style="background:${CC[c]}"></span>${c}: ${fmt(ct[CATS.indexOf(c)])}</span>`).join('');
  if(DOC)DOC.destroy();
  DOC=new Chart(document.getElementById('doc'),{type:'doughnut',data:{labels:nz,datasets:[{data:nz.map(c=>ct[CATS.indexOf(c)]),backgroundColor:nz.map(c=>CC[c]),borderWidth:2,borderColor:'#1e1e27'}]},options:{responsive:true,maintainAspectRatio:false,cutout:'65%',plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${c.label}: ETB ${Math.round(c.raw).toLocaleString()}`}}}}});

  const allM=months().slice().reverse();
  const mT=allM.map(m=>EXP.filter(e=>e.date.startsWith(m)).reduce((s,e)=>s+e.amount,0));
  if(TC)TC.destroy();
  TC=new Chart(document.getElementById('tc'),{type:'line',data:{labels:allM,datasets:[{label:'Total',data:mT,borderColor:'#6c63ff',backgroundColor:'rgba(108,99,255,.12)',fill:true,tension:.35,pointRadius:4,pointBackgroundColor:'#6c63ff'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`ETB ${Math.round(c.raw).toLocaleString()}`}}},scales:{x:{...baseScale},y:{...baseScale,ticks:{callback:v=>'ETB '+Math.round(v/1000)+'k',font:{size:10},color:tickColor}}}}});

  /* ── Daily totals list ── */
  document.getElementById('admonth-lbl').textContent=mo;
  const maxDay=days.length?Math.max(...days.map(d=>me.filter(e=>e.date===d).reduce((s,e)=>s+e.amount,0))):1;
  document.getElementById('adlist').innerHTML=days.length
    ?[...days].reverse().map(d=>{
        const dexp=me.filter(e=>e.date===d);
        const dtotal=dexp.reduce((s,e)=>s+e.amount,0);
        const bycat={};dexp.forEach(e=>bycat[e.cat]=(bycat[e.cat]||0)+e.amount);
        const segs=Object.entries(bycat).sort((a,b)=>b[1]-a[1])
          .map(([cat,a])=>`<div class="adrow-seg" style="background:${CC[cat]};width:${Math.round(a/dtotal*100)}%;flex-shrink:0" title="${cat}: ETB ${Math.round(a).toLocaleString()}"></div>`).join('');
        const lbl=d===today()?'Today':new Date(d+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});
        return`<div class="adrow">
          <div class="adrow-date">${lbl}</div>
          <div class="adrow-bars"><div class="adrow-bar">${segs}</div></div>
          <div class="adrow-amt">${fmt(dtotal)}</div>
        </div>`;
      }).join('')
    :'<div style="color:var(--muted);font-size:13px;padding:8px 0">No data for this month.</div>';

  /* ── Monthly totals table ── */
  const maxMo=mT.length?Math.max(...mT):1;
  const curMo=today().slice(0,7);
  document.getElementById('mtlist').innerHTML=allM.length
    ?allM.slice().reverse().map((m,i)=>{
        const amt=mT[i];
        const pct=maxMo?Math.round(amt/maxMo*100):0;
        const isCur=m===curMo;
        return`<div class="mtrow${isCur?' cur':''}">
          <div class="mtrow-mo">${m}${isCur?' ●':''}</div>
          <div class="mtrow-bar"><div class="mtrow-fill" style="width:${pct}%"></div></div>
          <div class="mtrow-amt">${fmt(amt)}</div>
        </div>`;
      }).reverse().join('')
    :'<div style="color:var(--muted);font-size:13px;padding:8px 0">No data yet.</div>';
}

/* ── Boot ── */
load();rToday();updateAddBanner();
</script>
</body>
</html>
