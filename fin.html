<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Finance Tracker</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f0f13;
    --bg2: #18181f;
    --bg3: #22222c;
    --card: #1e1e27;
    --border: rgba(255,255,255,0.07);
    --text: #f0f0f5;
    --muted: #8888a0;
    --accent: #6c63ff;
    --accent2: #9c94ff;
    --c-food:    #1D9E75;
    --c-trans:   #378ADD;
    --c-coffee:  #D4854A;
    --c-self:    #C065C8;
    --c-social:  #D4537E;
    --c-gym:     #E8A020;
    --c-entert:  #D85A30;
    --c-invest:  #4DA8DA;
    --c-work:    #6A9E5B;
    --radius: 14px;
    --radius-sm: 8px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, 'SF Pro Display', 'Segoe UI', sans-serif;
    min-height: 100vh; overscroll-behavior: none;
  }
  .app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
  .screen { display: none; flex: 1; overflow-y: auto; padding: 0 0 80px; }
  .screen.active { display: block; }

  /* ── Nav ── */
  .nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--bg2); border-top: 1px solid var(--border);
    display: flex; padding-bottom: var(--safe-bottom); z-index: 100;
  }
  .nav-btn {
    flex: 1; background: none; border: none; color: var(--muted);
    padding: 10px 4px 8px; display: flex; flex-direction: column;
    align-items: center; gap: 3px; font-size: 10px; font-weight: 500;
    cursor: pointer; transition: color .15s;
  }
  .nav-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .nav-btn.active { color: var(--accent2); }
  .nav-btn.active svg { stroke: var(--accent2); }

  /* ── Header ── */
  .screen-header {
    padding: 18px 16px 12px; position: sticky; top: 0;
    background: var(--bg); z-index: 10; border-bottom: 1px solid var(--border);
  }
  .screen-header h1 { font-size: 20px; font-weight: 700; }
  .screen-header p { font-size: 13px; color: var(--muted); margin-top: 2px; }

  /* ── Metrics ── */
  .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 14px 16px; }
  .metric-card { background: var(--card); border-radius: var(--radius); padding: 14px; border: 1px solid var(--border); }
  .metric-card.wide { grid-column: span 2; }
  .metric-label { font-size: 11px; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }
  .metric-val { font-size: 24px; font-weight: 700; }
  .metric-sub { font-size: 12px; color: var(--muted); margin-top: 3px; }

  /* ── Add form ── */
  .add-wrap { padding: 0 16px; }
  .amount-input-wrap {
    background: var(--card); border-radius: var(--radius);
    padding: 20px; margin-bottom: 16px; border: 1px solid var(--border); text-align: center;
  }
  .amount-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .amount-field {
    font-size: 42px; font-weight: 700; color: var(--text);
    background: none; border: none; width: 100%; text-align: center;
    outline: none; caret-color: var(--accent2);
  }
  .amount-field::placeholder { color: var(--bg3); }

  /* ── Two-column category grid ── */
  .cats-section { margin-bottom: 16px; }
  .cats-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-items: start; }
  .cats-col-header {
    font-size: 10px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: .6px;
    margin-bottom: 6px; padding: 0 2px;
  }
  .cats-col { display: flex; flex-direction: column; gap: 6px; }
  .cat-btn {
    background: var(--card); border: 1.5px solid var(--border);
    border-radius: var(--radius-sm); padding: 10px 10px;
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; font-weight: 500; color: var(--muted);
    cursor: pointer; transition: all .15s; text-align: left; width: 100%;
  }
  .cat-btn .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .cat-btn.active { color: var(--text); border-width: 2px; }
  .cat-btn[data-cat="Food & Water"].active      { border-color: var(--c-food);   background: rgba(29,158,117,.12); }
  .cat-btn[data-cat="Transportation"].active    { border-color: var(--c-trans);  background: rgba(55,138,221,.12); }
  .cat-btn[data-cat="Coffee & Sweets"].active   { border-color: var(--c-coffee); background: rgba(212,133,74,.12); }
  .cat-btn[data-cat="Self Care"].active         { border-color: var(--c-self);   background: rgba(192,101,200,.12); }
  .cat-btn[data-cat="Social & Family"].active            { border-color: var(--c-social); background: rgba(212,83,126,.12); }
  .cat-btn[data-cat="Gym & Health"].active      { border-color: var(--c-gym);    background: rgba(232,160,32,.12); }
  .cat-btn[data-cat="Entertainment"].active     { border-color: var(--c-entert); background: rgba(216,90,48,.12); }
  .cat-btn[data-cat="Work & Future Cash"].active { border-color: var(--c-invest); background: rgba(77,168,218,.12); }

  /* ── Form card ── */
  .form-card { background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; margin-bottom: 14px; }
  .form-row { display: flex; align-items: center; padding: 13px 16px; border-bottom: 1px solid var(--border); }
  .form-row:last-child { border-bottom: none; }
  .form-row-label { font-size: 13px; color: var(--muted); width: 70px; flex-shrink: 0; }
  .form-row input, .form-row select { flex: 1; background: none; border: none; color: var(--text); font-size: 14px; outline: none; text-align: right; font-family: inherit; }
  .form-row select option { background: var(--bg2); }

  .save-btn {
    width: 100%; background: var(--accent); color: #fff;
    border: none; border-radius: var(--radius);
    padding: 15px; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: opacity .15s; margin-bottom: 10px;
  }
  .save-btn:active { opacity: .8; }

  .toast {
    position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
    background: #1D9E75; color: #fff; padding: 10px 24px; border-radius: 30px;
    font-size: 13px; font-weight: 600; opacity: 0; pointer-events: none;
    transition: opacity .25s; z-index: 999; white-space: nowrap;
  }
  .toast.show { opacity: 1; }

  /* ── History ── */
  .filter-bar { display: flex; gap: 8px; padding: 10px 16px; overflow-x: auto; scrollbar-width: none; }
  .filter-bar::-webkit-scrollbar { display: none; }
  .filter-pill {
    flex-shrink: 0; background: var(--card); border: 1px solid var(--border);
    border-radius: 20px; padding: 6px 14px; font-size: 12px; font-weight: 500;
    color: var(--muted); cursor: pointer; transition: all .15s; white-space: nowrap;
  }
  .filter-pill.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .day-group { padding: 0 16px; margin-bottom: 6px; }
  .day-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 0 6px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
  .exp-item { background: var(--card); border-radius: var(--radius-sm); border: 1px solid var(--border); display: flex; align-items: center; gap: 12px; padding: 12px 14px; margin-bottom: 6px; }
  .exp-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
  .exp-body { flex: 1; min-width: 0; }
  .exp-cat { font-size: 13px; font-weight: 600; }
  .exp-note { font-size: 12px; color: var(--muted); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .exp-right { text-align: right; flex-shrink: 0; }
  .exp-amt { font-size: 14px; font-weight: 700; }
  .exp-time { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .del-swipe { background: #c0392b; border: none; color: #fff; border-radius: var(--radius-sm); padding: 0 14px; cursor: pointer; font-size: 18px; flex-shrink: 0; height: 60px; }
  .empty { text-align: center; padding: 48px 16px; color: var(--muted); font-size: 14px; }
  .empty-icon { font-size: 40px; margin-bottom: 12px; }

  /* ── Charts ── */
  .section { padding: 0 16px; margin-bottom: 18px; }
  .section-title { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 10px; }
  .chart-card { background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); padding: 14px; }
  .chart-wrap { position: relative; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); }
  .legend-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
  .month-sel { margin-bottom: 14px; }
  .month-sel select { width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); padding: 10px 14px; font-size: 14px; outline: none; font-family: inherit; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .bar-row-label { font-size: 12px; color: var(--muted); width: 110px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track { flex: 1; background: var(--bg3); border-radius: 4px; height: 8px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; transition: width .4s ease; }
  .bar-val { font-size: 11px; color: var(--muted); width: 70px; text-align: right; flex-shrink: 0; }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 4px; }
</style>
</head>
<body>
<div class="app">

  <!-- ══ ADD ══ -->
  <div class="screen active" id="screen-add">
    <div class="screen-header">
      <h1>Add Expense</h1>
      <p id="add-date-display"></p>
    </div>
    <div class="add-wrap" style="padding-top:14px;">

      <div class="amount-input-wrap">
        <div class="amount-label">Amount (ETB)</div>
        <input class="amount-field" id="inp-amount" type="number" inputmode="decimal" placeholder="0" min="0" step="0.01"/>
      </div>

      <!-- Two-column category layout -->
      <div class="cats-section">
        <div class="cats-cols">
          <!-- LEFT -->
          <div>
            <div class="cats-col-header">Essentials</div>
            <div class="cats-col">
              <button class="cat-btn" data-cat="Food & Water"><span class="dot" style="background:var(--c-food)"></span>🥗 Food & Water</button>
              <button class="cat-btn" data-cat="Transportation"><span class="dot" style="background:var(--c-trans)"></span>🚌 Transport</button>
              <button class="cat-btn" data-cat="Coffee & Sweets"><span class="dot" style="background:var(--c-coffee)"></span>☕ Coffee & Sweets</button>
              <button class="cat-btn" data-cat="Self Care"><span class="dot" style="background:var(--c-self)"></span>🪥 Self Care</button>
            </div>
          </div>
          <!-- RIGHT -->
          <div>
            <div class="cats-col-header">Lifestyle</div>
            <div class="cats-col">
              <button class="cat-btn" data-cat="Social &amp; Family"><span class="dot" style="background:var(--c-social)"></span>👥 Social & Family</button>
              <button class="cat-btn" data-cat="Gym & Health"><span class="dot" style="background:var(--c-gym)"></span>🏋️ Gym & Health</button>
              <button class="cat-btn" data-cat="Entertainment"><span class="dot" style="background:var(--c-entert)"></span>🎬 Entertainment</button>
              <button class="cat-btn" data-cat="Work & Future Cash"><span class="dot" style="background:var(--c-invest)"></span>💼 Work & Future Cash</button>
            </div>
          </div>
        </div>
      </div>

      <div class="form-card">
        <div class="form-row">
          <span class="form-row-label">Note</span>
          <input type="text" id="inp-note" placeholder="optional…"/>
        </div>
        <div class="form-row">
          <span class="form-row-label">Date</span>
          <input type="date" id="inp-date"/>
        </div>
      </div>

      <button class="save-btn" onclick="addExpense()">Save Expense</button>
    </div>
  </div>

  <!-- ══ TODAY ══ -->
  <div class="screen" id="screen-today">
    <div class="screen-header">
      <h1>Today</h1>
      <p id="today-date-label"></p>
    </div>
    <div class="metrics-grid" id="today-metrics"></div>
    <div class="section">
      <div class="section-title">Breakdown</div>
      <div class="chart-card"><div id="today-bars"></div></div>
    </div>
    <div class="section">
      <div class="section-title">Transactions</div>
      <div id="today-list"></div>
    </div>
  </div>

  <!-- ══ HISTORY ══ -->
  <div class="screen" id="screen-history">
    <div class="screen-header"><h1>History</h1></div>
    <div class="filter-bar" id="filter-bar">
      <div class="filter-pill active" onclick="setFilter(this,'')">All</div>
      <div class="filter-pill" onclick="setFilter(this,'Food & Water')">🥗 Food</div>
      <div class="filter-pill" onclick="setFilter(this,'Transportation')">🚌 Transport</div>
      <div class="filter-pill" onclick="setFilter(this,'Coffee & Sweets')">☕ Coffee</div>
      <div class="filter-pill" onclick="setFilter(this,'Self Care')">🪥 Self Care</div>
      <div class="filter-pill" onclick="setFilter(this,'Social & Family')">👥 Social & Family</div>
      <div class="filter-pill" onclick="setFilter(this,'Gym & Health')">🏋️ Gym</div>
      <div class="filter-pill" onclick="setFilter(this,'Entertainment')">🎬 Fun</div>
      <div class="filter-pill" onclick="setFilter(this,'Work & Future Cash')">💼 Work & Future</div>
    </div>
    <div id="history-content"></div>
  </div>

  <!-- ══ ANALYSIS ══ -->
  <div class="screen" id="screen-analysis">
    <div class="screen-header"><h1>Analysis</h1></div>
    <div style="padding:14px 16px 0;">
      <div class="month-sel">
        <select id="analysis-month" onchange="renderAnalysis()"></select>
      </div>
    </div>
    <div class="metrics-grid" id="analysis-metrics"></div>
    <div class="section">
      <div class="section-title">Daily spending</div>
      <div class="chart-card">
        <div class="legend" id="daily-legend"></div>
        <div class="chart-wrap" style="height:200px;"><canvas id="daily-chart" role="img" aria-label="Daily spending bar chart"></canvas></div>
      </div>
    </div>
    <div class="section">
      <div class="section-title">Category share</div>
      <div class="chart-card">
        <div class="legend" id="donut-legend"></div>
        <div class="chart-wrap" style="height:190px;"><canvas id="donut-chart" role="img" aria-label="Category donut chart"></canvas></div>
      </div>
    </div>
    <div class="section">
      <div class="section-title">Monthly overview</div>
      <div class="chart-card">
        <div class="chart-wrap" style="height:180px;"><canvas id="trend-chart" role="img" aria-label="Monthly trend chart"></canvas></div>
      </div>
    </div>
  </div>

  <!-- ══ NAV ══ -->
  <nav class="nav">
    <button class="nav-btn active" id="nav-add" onclick="switchScreen('add')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>Add
    </button>
    <button class="nav-btn" id="nav-today" onclick="switchScreen('today')">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Today
    </button>
    <button class="nav-btn" id="nav-history" onclick="switchScreen('history')">
      <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3" cy="6" r="1" fill="currentColor" stroke="none"/><circle cx="3" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="3" cy="18" r="1" fill="currentColor" stroke="none"/></svg>History
    </button>
    <button class="nav-btn" id="nav-analysis" onclick="switchScreen('analysis')">
      <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>Analysis
    </button>
  </nav>
</div>

<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor('#0f0f13'); tg.setBackgroundColor('#0f0f13'); }

const CATS = ['Food & Water','Transportation','Coffee & Sweets','Self Care','Social & Family','Gym & Health','Entertainment','Work & Future Cash'];
const CAT_COLORS = {
  'Food & Water':  '#1D9E75',
  'Transportation':'#378ADD',
  'Coffee & Sweets':'#D4854A',
  'Self Care':     '#C065C8',
  'Social & Family':'#D4537E',
  'Gym & Health':  '#E8A020',
  'Entertainment': '#D85A30',
  'Work & Future Cash': '#4DA8DA'
};
const CAT_EMOJI = {
  'Food & Water':'🥗','Transportation':'🚌','Coffee & Sweets':'☕','Self Care':'🪥',
  'Social & Family':'👥','Gym & Health':'🏋️','Entertainment':'🎬','Work & Future Cash':'💼'
};

let expenses = [], selectedCat = '', histCat = '';
let dailyChartInst = null, donutChartInst = null, trendChartInst = null;

function storageKey() { return 'finance_expenses_' + (tg?.initDataUnsafe?.user?.id || 'local'); }
function loadData() { try { expenses = JSON.parse(localStorage.getItem(storageKey()) || '[]'); } catch(e) { expenses = []; } }
function saveData() { localStorage.setItem(storageKey(), JSON.stringify(expenses)); }
function today() { return new Date().toISOString().slice(0,10); }
function fmtAmt(n) { return 'ETB ' + Math.round(n).toLocaleString(); }
function fmtDate(d) { return new Date(d+'T00:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}); }

function switchScreen(name) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  document.getElementById('nav-'+name).classList.add('active');
  if (name==='today') renderToday();
  if (name==='history') renderHistory();
  if (name==='analysis') { populateMonthSel(); renderAnalysis(); }
}

// ── Add ──
document.getElementById('inp-date').value = today();
document.getElementById('add-date-display').textContent = fmtDate(today());

document.querySelectorAll('.cat-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    selectedCat = btn.dataset.cat;
    if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
  });
});

function addExpense() {
  const amount = parseFloat(document.getElementById('inp-amount').value);
  const date   = document.getElementById('inp-date').value;
  const note   = document.getElementById('inp-note').value.trim();
  if (!amount || amount<=0) { showToast('Enter a valid amount', true); return; }
  if (!selectedCat)          { showToast('Pick a category', true); return; }
  if (!date)                 { showToast('Pick a date', true); return; }
  expenses.push({ id: Date.now(), amount, date, note, cat: selectedCat });
  saveData();
  document.getElementById('inp-amount').value = '';
  document.getElementById('inp-note').value   = '';
  document.getElementById('inp-date').value   = today();
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
  selectedCat = '';
  if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
  showToast('Saved! ✓');
}

function showToast(msg, error=false) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.background = error ? '#c0392b' : '#1D9E75';
  t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 2000);
}

// ── Today ──
function renderToday() {
  const t = today();
  document.getElementById('today-date-label').textContent = fmtDate(t);
  const todays = expenses.filter(e=>e.date===t);
  const total  = todays.reduce((s,e)=>s+e.amount,0);
  const topCat = (() => {
    const m={}; todays.forEach(e=>{ m[e.cat]=(m[e.cat]||0)+e.amount; });
    return Object.entries(m).sort((a,b)=>b[1]-a[1])[0]?.[0]||'—';
  })();
  document.getElementById('today-metrics').innerHTML = `
    <div class="metric-card">
      <div class="metric-label">Total today</div>
      <div class="metric-val">${fmtAmt(total)}</div>
      <div class="metric-sub">${todays.length} transaction${todays.length!==1?'s':''}</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Top category</div>
      <div class="metric-val" style="font-size:16px;">${CAT_EMOJI[topCat]||''} ${topCat}</div>
    </div>`;
  const bycat = {}; todays.forEach(e=>{ bycat[e.cat]=(bycat[e.cat]||0)+e.amount; });
  const sorted = Object.entries(bycat).sort((a,b)=>b[1]-a[1]);
  const max = sorted[0]?.[1]||1;
  document.getElementById('today-bars').innerHTML = sorted.length
    ? sorted.map(([cat,amt])=>`<div class="bar-row">
        <div class="bar-row-label">${CAT_EMOJI[cat]} ${cat}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.round(amt/max*100)}%;background:${CAT_COLORS[cat]}"></div></div>
        <div class="bar-val">${fmtAmt(amt)}</div></div>`).join('')
    : '<div style="color:var(--muted);font-size:13px;padding:8px 0;">No expenses yet today.</div>';
  document.getElementById('today-list').innerHTML = todays.length
    ? todays.slice().reverse().map(e=>expItem(e)).join('')
    : '<div class="empty"><div class="empty-icon">📭</div>No transactions today.</div>';
}

// ── History ──
function setFilter(el, cat) {
  document.querySelectorAll('.filter-pill').forEach(p=>p.classList.remove('active'));
  el.classList.add('active'); histCat = cat; renderHistory();
}
function renderHistory() {
  let list = [...expenses].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
  if (histCat) list = list.filter(e=>e.cat===histCat);
  if (!list.length) { document.getElementById('history-content').innerHTML='<div class="empty"><div class="empty-icon">📭</div>No expenses found.</div>'; return; }
  const groups = {}; list.forEach(e=>{ (groups[e.date]=groups[e.date]||[]).push(e); });
  document.getElementById('history-content').innerHTML = Object.entries(groups).map(([date,items])=>{
    const dayTotal = items.reduce((s,e)=>s+e.amount,0);
    const label = date===today()?'Today':fmtDate(date);
    return `<div class="day-group"><div class="day-header"><span>${label}</span><span>${fmtAmt(dayTotal)}</span></div>${items.map(e=>expItem(e)).join('')}</div>`;
  }).join('');
}

function expItem(e) {
  return `<div class="exp-item" id="exp-${e.id}">
    <div class="exp-icon" style="background:${CAT_COLORS[e.cat]||'#444'}22;">${CAT_EMOJI[e.cat]||'💸'}</div>
    <div class="exp-body">
      <div class="exp-cat">${e.cat}</div>
      ${e.note?`<div class="exp-note">${e.note}</div>`:''}
    </div>
    <div class="exp-right">
      <div class="exp-amt">${fmtAmt(e.amount)}</div>
      <div class="exp-time">${e.date}</div>
    </div>
    <button class="del-swipe" onclick="deleteExp(${e.id})" aria-label="Delete">🗑</button>
  </div>`;
}

function deleteExp(id) {
  if (tg?.showConfirm) tg.showConfirm('Delete this expense?', ok=>{ if(ok) doDelete(id); });
  else if (confirm('Delete?')) doDelete(id);
}
function doDelete(id) {
  expenses = expenses.filter(e=>e.id!==id); saveData();
  const el = document.getElementById('exp-'+id); if (el) el.remove();
  if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('warning');
}

// ── Analysis ──
function getMonths() {
  const ms = new Set(expenses.map(e=>e.date.slice(0,7)));
  ms.add(today().slice(0,7)); return [...ms].sort().reverse();
}
function populateMonthSel() {
  const sel = document.getElementById('analysis-month');
  const months = getMonths(); const cur = sel.value||months[0];
  sel.innerHTML = months.map(m=>`<option value="${m}" ${m===cur?'selected':''}>${m}</option>`).join('');
}
function renderAnalysis() {
  const month = document.getElementById('analysis-month').value||today().slice(0,7);
  const mexp  = expenses.filter(e=>e.date.startsWith(month));
  const total = mexp.reduce((s,e)=>s+e.amount,0);
  const days  = [...new Set(mexp.map(e=>e.date))].sort();
  const avg   = days.length ? total/days.length : 0;

  document.getElementById('analysis-metrics').innerHTML = `
    <div class="metric-card">
      <div class="metric-label">Month total</div>
      <div class="metric-val">${fmtAmt(total)}</div>
      <div class="metric-sub">${days.length} active days</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Daily average</div>
      <div class="metric-val">${fmtAmt(avg)}</div>
      <div class="metric-sub">${mexp.length} transactions</div>
    </div>`;

  document.getElementById('daily-legend').innerHTML = CATS.map(c=>`<span class="legend-item"><span class="legend-dot" style="background:${CAT_COLORS[c]}"></span>${c}</span>`).join('');

  const datasets = CATS.map(cat=>({
    label: cat,
    data: days.map(d=>mexp.filter(e=>e.date===d&&e.cat===cat).reduce((s,e)=>s+e.amount,0)),
    backgroundColor: CAT_COLORS[cat], borderRadius:3, borderSkipped:false
  }));
  const scaleOpts = { stacked:true, ticks:{font:{size:10},color:'#8888a0'}, grid:{color:'rgba(255,255,255,.04)'} };

  if (dailyChartInst) dailyChartInst.destroy();
  dailyChartInst = new Chart(document.getElementById('daily-chart'),{
    type:'bar', data:{ labels:days.map(d=>d.slice(5)), datasets },
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false}, tooltip:{callbacks:{label:ctx=>`${ctx.dataset.label}: ETB ${Math.round(ctx.raw).toLocaleString()}`}} },
      scales:{ x:{...scaleOpts}, y:{...scaleOpts, ticks:{callback:v=>'ETB '+Math.round(v/1000)+'k',font:{size:10},color:'#8888a0'}} }
    }
  });

  const catTotals = CATS.map(cat=>mexp.filter(e=>e.cat===cat).reduce((s,e)=>s+e.amount,0));
  const nonZero   = CATS.filter((_,i)=>catTotals[i]>0);
  document.getElementById('donut-legend').innerHTML = nonZero.map(c=>`<span class="legend-item"><span class="legend-dot" style="background:${CAT_COLORS[c]}"></span>${c}: ${fmtAmt(catTotals[CATS.indexOf(c)])}</span>`).join('');

  if (donutChartInst) donutChartInst.destroy();
  donutChartInst = new Chart(document.getElementById('donut-chart'),{
    type:'doughnut',
    data:{ labels:nonZero, datasets:[{ data:nonZero.map(c=>catTotals[CATS.indexOf(c)]), backgroundColor:nonZero.map(c=>CAT_COLORS[c]), borderWidth:2, borderColor:'#1e1e27' }] },
    options:{ responsive:true, maintainAspectRatio:false, cutout:'64%',
      plugins:{ legend:{display:false}, tooltip:{callbacks:{label:ctx=>`${ctx.label}: ETB ${Math.round(ctx.raw).toLocaleString()}`}} }
    }
  });

  const allMonths = getMonths().slice().reverse();
  const mTotals   = allMonths.map(m=>expenses.filter(e=>e.date.startsWith(m)).reduce((s,e)=>s+e.amount,0));
  if (trendChartInst) trendChartInst.destroy();
  trendChartInst = new Chart(document.getElementById('trend-chart'),{
    type:'line',
    data:{ labels:allMonths, datasets:[{ label:'Total', data:mTotals, borderColor:'#6c63ff', backgroundColor:'rgba(108,99,255,.12)', fill:true, tension:.35, pointRadius:4, pointBackgroundColor:'#6c63ff' }] },
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false}, tooltip:{callbacks:{label:ctx=>`ETB ${Math.round(ctx.raw).toLocaleString()}`}} },
      scales:{
        x:{ ticks:{font:{size:10},color:'#8888a0'}, grid:{color:'rgba(255,255,255,.04)'} },
        y:{ ticks:{callback:v=>'ETB '+Math.round(v/1000)+'k',font:{size:10},color:'#8888a0'}, grid:{color:'rgba(255,255,255,.04)'} }
      }
    }
  });
}

loadData();
renderToday();
</script>
</body>
</html>
